services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ksb_erp
      MYSQL_USER: ksb
      MYSQL_PASSWORD: ksb
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ksb_mysql:/var/lib/mysql

volumes:
  ksb_mysql:
